
name: Build Jawali Wallet APK V30.89

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          unzip -q JawaliWallet_Android_V30_89_Source.zip -d extracted
          test -f extracted/JawaliWallet_Android_V30_89/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          test -d "$ANDROID_HOME" || exit 1

          echo "Available Android SDK platforms:"
          ls -la "$ANDROID_HOME/platforms" || true

          echo "Available build tools:"
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        shell: bash
        run: |
          gradle \
            -p extracted/JawaliWallet_Android_V30_89 \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JawaliWallet-V30.89-APK
          path: extracted/JawaliWallet_Android_V30_89/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
