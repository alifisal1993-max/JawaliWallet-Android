name: Build Jawali Wallet V31.17 APK
on:
  workflow_dispatch:
  push:
    branches: [v31.17-captive-portal-chooser]
    paths:
      - 'JawaliWallet-V31.08-LAN-Free-Access-Source.zip'
      - '.github/workflows/build-jawali-v31-08.yml'
      - '.github/scripts/patch-v31-09.py'
      - '.github/scripts/patch-v31-10.py'
      - '.github/scripts/patch-v31-11.py'
      - '.github/scripts/patch-v31-12.py'
      - '.github/scripts/patch-v31-13.py'
      - '.github/scripts/patch-v31-14.py'
      - '.github/scripts/patch-v31-15.py'
      - '.github/scripts/patch-v31-16.py'
      - '.github/scripts/patch-v31-17.py'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check V31.08 source archive
        shell: bash
        run: |
          test -f JawaliWallet-V31.08-LAN-Free-Access-Source.zip || {
            echo "::error::Upload JawaliWallet-V31.08-LAN-Free-Access-Source.zip to the root of this branch before running."
            exit 1
          }
          unzip -tq JawaliWallet-V31.08-LAN-Free-Access-Source.zip
          unzip -q JawaliWallet-V31.08-LAN-Free-Access-Source.zip -d extracted
          test -f extracted/JawaliWallet_Android_V31_07/app/build.gradle
      - name: Validate Android project files
        shell: bash
        run: |
          test -f extracted/JawaliWallet_Android_V31_07/settings.gradle
          test -f extracted/JawaliWallet_Android_V31_07/app/src/main/AndroidManifest.xml
      - name: Apply V31.09 local-first patch
        run: |
          python3 .github/scripts/patch-v31-09.py
          node --check extracted/JawaliWallet_Android_V31_07/app/src/main/assets/jawali-live.js
      - name: Apply V31.10 phone profile fix
        run: |
          python3 .github/scripts/patch-v31-10.py
          node --check extracted/JawaliWallet_Android_V31_07/app/src/main/assets/jawali-live.js
      - name: Apply V31.11 Full-System phone integration
        run: |
          python3 .github/scripts/patch-v31-11.py
          node --check extracted/JawaliWallet_Android_V31_07/app/src/main/assets/jawali-live.js
      - name: Apply V31.12 Full-System flow
        run: |
          python3 .github/scripts/patch-v31-12.py
          node --check extracted/JawaliWallet_Android_V31_07/app/src/main/assets/jawali-live.js
      - name: Apply V31.13 Hotspot and quota fix
        run: |
          python3 .github/scripts/patch-v31-13.py
          node --check extracted/JawaliWallet_Android_V31_07/app/src/main/assets/jawali-live.js
      - name: Apply V31.14 status-first fix
        run: |
          python3 .github/scripts/patch-v31-14.py
          node --check extracted/JawaliWallet_Android_V31_07/app/src/main/assets/jawali-live.js
      - name: Apply V31.15 form-less Hotspot fix
        run: |
          python3 .github/scripts/patch-v31-15.py
          node --check extracted/JawaliWallet_Android_V31_07/app/src/main/assets/jawali-live.js
      - name: Apply V31.16 captive Wi-Fi entry
        run: |
          python3 .github/scripts/patch-v31-16.py
          node --check extracted/JawaliWallet_Android_V31_07/app/src/main/assets/jawali-live.js
      - name: Apply V31.17 Android captive portal chooser
        run: |
          python3 .github/scripts/patch-v31-17.py
          node --check extracted/JawaliWallet_Android_V31_07/app/src/main/assets/jawali-live.js
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          test -d "$SDK_ROOT/platforms/android-35"
          test -d "$SDK_ROOT/build-tools/35.0.0"
          echo "Android 35 and build tools 35.0.0 available"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            echo "Android build attempt $attempt/4"
            if gradle -p extracted/JawaliWallet_Android_V31_07 --no-daemon --stacktrace assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: JawaliWallet-V31.17-APK
          path: extracted/JawaliWallet_Android_V31_07/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
