name: Build Jawali Wallet V30.91 (integration)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check Android source archive
        shell: bash
        run: |
          test -f JawaliWallet_Android_V30_91_Source.zip || { echo "Upload V30.91 ZIP to repository root before building."; exit 1; }
          unzip -q JawaliWallet_Android_V30_91_Source.zip -d extracted
          test -f extracted/JawaliWallet_Android_V30_91/app/build.gradle
          test -f extracted/JawaliWallet_Android_V30_91/app/src/main/assets/jawali-live.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK
        shell: bash
        run: |
          set -e
          ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ROOT" >> "$GITHUB_ENV"
          test -d "$ROOT"
          MGR="$ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$MGR" ]; then
            MGR="$(find "$ROOT/cmdline-tools" -name sdkmanager -type f -print -quit)"
          fi
          test -x "$MGR"
          echo "SDKMANAGER=$MGR" >> "$GITHUB_ENV"
      - name: Verify SDK packages
        shell: bash
        run: |
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-35" ] || [ ! -d "$ANDROID_SDK_ROOT/build-tools/35.0.0" ]; then
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          fi
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle -p extracted/JawaliWallet_Android_V30_91 --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JawaliWallet-V30.91-Integration-APK
          path: extracted/JawaliWallet_Android_V30_91/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
