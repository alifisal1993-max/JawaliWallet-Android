
name: Build Jawali Wallet APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q JawaliWallet_Android_V30_79_Source.zip -d extracted

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle -p extracted/JawaliWallet_Android_V30_79 --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JawaliWallet-APK
          path: extracted/JawaliWallet_Android_V30_79/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
